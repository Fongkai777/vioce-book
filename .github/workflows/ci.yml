name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install pinned package manager
        run: npm install --global pnpm@11.25.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
      - name: Review complete dependency audit and verify local mitigation
        run: pnpm audit:reviewed
      - name: Check release boundaries and secret patterns
        run: pnpm check:release
      - name: Type check
        run: pnpm typecheck
      - name: Unit and server integration tests (no external AI calls)
        run: pnpm test
      - name: Build Worker and client
        run: pnpm build

# Deliberately no deployment step, production credentials or pull_request_target.
